<!DOCTYPE html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sophie Sowon</title>
<style>html,body{margin:0;background:#f7f4ef;font-family:Georgia,serif}h1{text-align:center;font-weight:500;font-size:1.2rem;padding:20px 8px 4px}#g{display:flex;flex-wrap:wrap;gap:8px;padding:16px;justify-content:center}img{max-height:28vh;border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.12)}audio{display:block;margin:16px auto 32px;width:min(420px,90%)}</style></head>
<body><h1>Sophie Sowon</h1><main id=g></main><script>
(async()=>{
  const g=document.getElementById('g');
  for(let i=1;i<=8;i++){
    const n=String(i).padStart(2,'0');
    const b64=await fetch(n+'.jpg.b64').then(r=>r.text());
    const im=new Image(); im.src='data:image/jpeg;base64,'+b64.trim(); im.alt='work '+n; g.appendChild(im);
  }
  const a1=await fetch('audio/01.mp3.b64').then(r=>r.text());
  const audio=document.createElement('audio'); audio.controls=true;
  audio.src='data:audio/mpeg;base64,'+a1.trim(); document.body.appendChild(audio);
})();
</script></body></html>
